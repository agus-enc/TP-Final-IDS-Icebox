{% extends "base.html" %}

{% block title %}Panel Admin - Icebox{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content%}
<div class="admin-container">
    <h1 class="admin-title">
        Panel de Control: Administrador        
    </h1>
    
    <div class="chart-card">
        <h3>Estadísticas de Viajes Globales</h3>

        <img src= "{{ url_for('static', filename='images/grafico_admin.png') }}" alt="Gráfico de estadísticas" class="chart-img">
    </div>

    <a href= "http://127.0.0.1:5000/api/admin/descargar-reporte" class="btn-download-pdf">
        Descargar Reporte en PDF
    </a>
</div>
{% endblock %}
