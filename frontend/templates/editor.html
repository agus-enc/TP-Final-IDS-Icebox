<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icebox - Prueba de Diseño</title>

    <link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>

    <form class="contenedor-viaje" id="formulario-viaje-maestro" method="POST" action="/viajes/{{ viaje.id_viaje }}/editar" enctype="multipart/form-data">

        <input type="hidden" id="flag-borrar-portada" name="borrar_portada" value="false">
        <input type="hidden" id="input-paradas-borradas" name="paradas_borradas" value="">

        <header class="header-viaje" id="header-portada" {% if viaje.url_portada %} style="background-image: url('{{ viaje.url_portada }}');" {% endif %}>
            <div class="overlay-portada"></div>
            <input type="file" id="foto-portada" name="foto_portada" accept="image/png, image/jpeg" style="display: none;">
            <div class="acciones-header">
                <a href="#" class="btn-volver">← Volver a Biblioteca</a>
                <div class="acciones-portada">

                    <label for="foto-portada" class="btn-icono-portada" title="Cambiar Portada">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </label>

                    <button type="button" class="btn-icono-portada btn-eliminar-portada" id="btn-borrar-portada" title="Eliminar Portada">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>

                </div>
            </div>
            <div class="contenedor-titulo-editable">
                <input type="text" id="titulo-viaje" name="titulo_viaje" class="input-titulo-viaje" placeholder="Dale un nombre a tu viaje" value="{{ viaje.titulo }}">
            </div>
        </header>

        <div class="galeria">
            <button type="button" class="btn-diario-fotos"> Diario de Fotos</button>
        </div>

        <div class="linea-tiempo">

            {% for parada in paradas %}
            <div class="tarjeta-parada">

                <div class="tarjeta-header">
                    <div class="selector-ciudad">
                        <div class="buscador-ciudad-wrapper" id="wrapper-ciudad-{{ loop.index }}">
                            <input type="text" class="input-buscador-ciudad" id="input-ciudad-{{ loop.index }}" placeholder="¿Qué ciudad visitaste?" autocomplete="off" value="{{ parada.nombre_ciudad }}">
                            <input type="hidden" name="ciudad_parada_{{ loop.index }}" id="hidden-ciudad-{{ loop.index }}" value="{{ parada.id_ciudad }}">
                            <input type="hidden" class="hidden-id-parada" name="id_parada_{{ loop.index }}" value="{{ parada.id_parada }}">
                            <ul class="lista-resultados-ciudad" id="resultados-ciudad-{{ loop.index }}"></ul>
                        </div>
                    </div>
                    <button type="button" class="btn-eliminar-parada">×</button>
                </div>

                <div class="tarjeta-cuerpo">
                    <div class="seccion-editor">
                        <textarea id="texto-parada-{{ loop.index }}" name="texto_parada_{{ loop.index }}" class="textarea-elegante" placeholder="¿Cómo la pasaste?">{{ parada.texto_resena }}</textarea>
                    </div>

                    <div class="seccion-iman">
                        <label for="foto-parada-{{ loop.index }}" class="contenedor-foto-iman vacio">
                            <span class="icono-mas">+</span>
                            <p>Subir Imán</p>
                        </label>
                        <input type="file" id="foto-parada-{{ loop.index }}" name="foto_parada_{{ loop.index }}" accept="image/png, image/jpeg" style="display: none;">
                    </div>
                </div>

                <div class="tarjeta-footer">
                    <button type="button" class="btn-guardar-parada">Guardar</button>
                </div>

            </div>
            {% endfor %}

        </div> <div class="acciones-globales">
            <button type="button" class="btn-principal" id="btn-agregar-parada">+ Agregar Nueva Parada</button>
            <button type="submit" class="btn-principal" style="background-color: #3498db; margin-left: 15px;">💾 Finalizar y Guardar Viaje</button>
        </div>

    </form>

    <div id="overlay-enfoque-texto" class="visor-oculto"></div>

    <div id="visor-foto-modal" class="visor-oculto">
        <button class="btn-cerrar-visor" title="Cerrar">×</button>
        <img id="imagen-visor" src="" alt="Vista previa en grande">
    </div>

    <script>
        const CIUDADES_DB = {{ lugares | tojson | safe }};
    </script>

    <script src="/static/js/editor.js"></script>
</body>
</html>
