{% extends "base.html" %}

{% block title %}Registro - Icebox{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
{% endblock %}

{% block content %}
<div class="registro-wrapper">
    
    <div class="registro-card">
        <h2>Crear Cuenta</h2>

        <form action="{{ url_for('login.procesar_registro') }}" method="POST">
            
            <div class="form-group">
                <label>Nombre de Usuario:</label>
                <input type="text" name="nombre_usuario" required class="registro-input">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required class="registro-input">
            </div>

            <div class="form-group-last">
                <label>Contraseña:</label>
                <input type="password" name="password" required class="registro-input">
            </div>

            <button type="submit" class="btn-registro">
                Registrarme
            </button>
        </form>

        <br>
        <a href="{{ url_for('login.login') }}" class="back-link">
            Volver al Login
        </a>
    </div>
</div>
{% endblock %}
