{% extends "base.html" %}

{% block title %}Registro - Icebox{% endblock %}

{% block content %}
<div style="padding: 40px; text-align: center; font-family: 'Poppins', sans-serif; background-color: #F2E9E4; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    
    <div style="border: 3px solid #333333; background: white; width: 100%; max-width: 400px; padding: 30px; box-shadow: 8px 8px 0px #333333; border-radius: 8px; box-sizing: border-box;">
        
        <h2 style="margin-top: 0; color: #333333; border-bottom: 3px solid #333333; padding-bottom: 10px; display: inline-block;">
            Crear Cuenta
        </h2>

        <form action="{{ url_for('login.procesar_registro') }}" method="POST" style="text-align: left; margin-top: 20px;">
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Nombre de Usuario:</label>
                <input type="text" name="nombre_usuario" required style="width: 100%; padding: 10px; border: 2px solid #333333; box-shadow: 3px 3px 0px #333333; box-sizing: border-box; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email:</label>
                <input type="email" name="email" required style="width: 100%; padding: 10px; border: 2px solid #333333; box-shadow: 3px 3px 0px #333333; box-sizing: border-box; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 25px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Contraseña:</label>
                <input type="password" name="password" required style="width: 100%; padding: 10px; border: 2px solid #333333; box-shadow: 3px 3px 0px #333333; box-sizing: border-box; border-radius: 4px;">
            </div>

            <button type="submit" style="width: 100%; background: #7485e6; color: white; font-weight: bold; padding: 12px; border: 3px solid #333333; box-shadow: 4px 4px 0px #333333; font-size: 16px; cursor: pointer; border-radius: 4px;">
                Registrarme 🎉
            </button>
        </form>

        <br>
        <a href="{{ url_for('login.vista_login') }}" style="color: #333333; font-size: 14px; font-weight: bold;">
            ← Volver al Login
        </a>
    </div>
</div>
{% endblock %}
